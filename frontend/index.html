<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MUBAS Assessment System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-text" style="text-align:center;margin-bottom:30px;">
                <img src="/images/mubas-logo.png" alt="MUBAS" style="height:80px;width:auto;margin-bottom:15px;">
                <h2 style="margin:0;color:#003366;font-size:22px;">MUBAS Assessment System</h2>
                <p style="margin:5px 0 0 0;color:#666;font-size:14px;">Sign in to continue</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" value="student.wilson" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" value="password" required>
                </div>

                <button type="submit" class="btn-login">Sign In</button>

                <div class="error-msg" id="errorMsg"></div>
            </form>

            <div style="margin-top: 20px; font-size: 13px; color: #888; text-align: center; border-top: 1px solid #eee; padding-top: 15px;">
                <p style="margin-bottom:6px;"><strong>Demo Credentials:</strong></p>
                <p style="margin:3px 0;">Student: <code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;">student.wilson</code> / <code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;">password</code></p>
                <p style="margin:3px 0;">Admin: <code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;">admin</code> / <code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;">password</code></p>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
